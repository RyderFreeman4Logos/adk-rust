no_tty: true
pre-commit:
  piped: true
  commands:
    branch-protection:
      run: just check-branch
    local-gates:
      run: just pre-commit-fast
    shellcheck:
      glob: "*.sh"
      run: shellcheck --severity=warning {staged_files}
pre-push:
  commands:
    local-gates:
      run: just pre-push
      use_stdin: true
